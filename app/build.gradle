plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daosheng.selenelivetv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.daosheng.selenelivetv'
        minSdk 28
        targetSdk 35
        versionCode 15
        versionName '1.4.9-android9-gitee-primary'
        ndk { abiFilters 'armeabi-v7a' }
    }
}

dependencies {
    implementation 'dev.jdtech.mpv:libmpv:1.0.0'
}
